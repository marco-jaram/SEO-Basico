<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analizador SEO básico</title>
    <style>
        /* --- ESTILOS GENERALES. Y FUENTES --- */
        :root {
            --color-primario: #007bff;
            --color-secundario: #6c757d;
            --color-fondo: #f8f9fa;
            --color-tarjeta: #ffffff;
            --color-texto: #212529;
            --color-borde: #dee2e6;
            --sombra-tarjeta: 0 4px 8px rgba(0,0,0,0.05);
            --radio-borde: 8px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--color-fondo);
            color: var(--color-texto);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        .container {
            max-width: 1200px; /* Ancho aumentado para más contenido */
            width: 100%;
            background-color: var(--color-tarjeta);
            padding: 30px;
            border-radius: var(--radio-borde);
            box-shadow: var(--sombra-tarjeta);
        }

        header {
            text-align: center;
            border-bottom: 1px solid var(--color-borde);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--color-primario);
            margin: 0;
        }

        header p {
            color: var(--color-secundario);
            margin-top: 5px;
        }

        /* --- FORMULARIO DE ENTRADA --- */
        #seo-form {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        #url-input {
            flex-grow: 1;
            padding: 12px;
            border: 1px solid var(--color-borde);
            border-radius: var(--radio-borde);
            font-size: 16px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #url-input:focus {
            outline: none;
            border-color: var(--color-primario);
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.25);
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background-color: var(--color-primario);
            border: none;
            border-radius: var(--radio-borde);
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0056b3;
        }
        
        button:disabled {
            background-color: var(--color-secundario);
            cursor: not-allowed;
        }

        /* --- INDICADOR DE CARGA (SPINNER) --- */
        .loader {
            display: none;
            width: 40px;
            height: 40px;
            border: 4px solid var(--color-borde);
            border-top-color: var(--color-primario);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 40px auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        
        /* --- MENSAJES DE ERROR --- */
        #error-message {
            display: none;
            color: #dc3545;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            padding: 15px;
            border-radius: var(--radio-borde);
            text-align: center;
            margin: 20px 0;
        }

        /* --- CONTENEDOR DE RESULTADOS Y TARJETAS --- */
        #results-container {
            display: grid;
            /* Columnas más flexibles */
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }

        .result-card {
            background-color: #fff;
            border: 1px solid var(--color-borde);
            border-radius: var(--radio-borde);
            padding: 20px;
            box-shadow: var(--sombra-tarjeta);
            display: flex;
            flex-direction: column;
        }
        
        /* Tarjeta ancha para contenido denso */
        .result-card.full-width {
            grid-column: 1 / -1;
        }

        .result-card h3 {
            margin: 0 0 10px 0;
            font-size: 18px;
            color: var(--color-primario);
            border-bottom: 1px solid var(--color-borde);
            padding-bottom: 10px;
        }

        .result-card p, .result-card ul {
            margin: 0;
            color: var(--color-texto);
            word-wrap: break-word;
            flex-grow: 1;
        }
        
        .result-card p.not-found {
            color: var(--color-secundario);
            font-style: italic;
        }
        
        .result-card ul {
            padding-left: 20px;
        }
        
        .result-card li {
            margin-bottom: 8px;
        }
        
        .result-card li strong {
            color: var(--color-primario);
        }

        /* Estilos para imágenes y favicon */
        .result-card img {
            max-width: 100%;
            height: auto;
            border-radius: var(--radio-borde);
            margin-top: 10px;
            border: 1px solid var(--color-borde);
        }
        
        .result-card .favicon-img {
            width: 32px;
            height: 32px;
            vertical-align: middle;
            margin-right: 10px;
        }

        /* Estilos específicos para la tarjeta de Previsualización Social */
        .og-preview {
            border: 1px solid #ccc;
            border-radius: var(--radio-borde);
            overflow: hidden;
            background-color: #f0f2f5; /* Color de fondo similar a redes sociales */
            margin-top: 15px;
        }
        .og-preview .og-image {
            width: 100%;
            height: 200px; /* Altura fija para la imagen de previsualización */
            object-fit: cover; /* Asegura que la imagen cubra el área sin distorsionarse */
            border-bottom: 1px solid #ddd;
        }
        .og-preview .og-content {
            padding: 15px;
            background-color: var(--color-tarjeta);
        }
        .og-preview .og-title {
            font-weight: bold;
            font-size: 1.1em;
            color: #1a0dab; /* Color de enlace típico */
            margin-bottom: 5px;
        }
        .og-preview .og-description {
            font-size: 0.9em;
            color: #444;
            margin-bottom: 5px;
        }
        .og-preview .og-url {
            font-size: 0.8em;
            color: #606770; /* Color de URL típico */
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <main class="container">
        <header>
            <h1>Analizador SEO básico</h1>
            <p>Ingresa la URL de un sitio web para extraer su información SEO principal.</p>
        </header>

        <form id="seo-form">
            <input type="url" id="url-input" placeholder="https://ejemplo.com" required>
            <button type="submit" id="analyze-button">Analizar Sitio</button>
        </form>

        <div id="loader" class="loader"></div>
        <div id="error-message"></div>
        <div id="results-container"></div>
    </main>

    <script>
    // --- INICIO DEL CÓDIGO JAVASCRIPT ---
    
    // =================================================================================
    //  EXPLICACIÓN DEL PROXY CORS
    // =================================================================================
    // (La explicación del proxy no ha cambiado y se mantiene aquí)
    // =================================================================================

    const form = document.getElementById('seo-form');
    const urlInput = document.getElementById('url-input');
    const analyzeButton = document.getElementById('analyze-button');
    const loader = document.getElementById('loader');
    const resultsContainer = document.getElementById('results-container');
    const errorMessage = document.getElementById('error-message');

    form.addEventListener('submit', function(event) {
        event.preventDefault();
        analizarSitio();
    });

    async function analizarSitio() {
        const url = urlInput.value.trim();
        if (!url) {
            mostrarError("Por favor, ingresa una URL válida.");
            return;
        }
        prepararUI();
        try {
            const html = await fetchSiteHtml(url);
            const doc = parseHtml(html);
            const seoData = extraerDatosSEO(doc, url);
            mostrarResultados(seoData);
        } catch (error) {
            console.error("Error en el análisis:", error);
            mostrarError(`No se pudo analizar el sitio. Error: ${error.message}`);
        } finally {
            finalizarCarga();
        }
    }
    
    function prepararUI() {
        resultsContainer.innerHTML = '';
        errorMessage.style.display = 'none';
        loader.style.display = 'block';
        analyzeButton.disabled = true;
        analyzeButton.textContent = 'Analizando...';
    }
    
    function finalizarCarga() {
        loader.style.display = 'none';
        analyzeButton.disabled = false;
        analyzeButton.textContent = 'Analizar Sitio';
    }

    async function fetchSiteHtml(targetUrl) {
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
        const response = await fetch(proxyUrl);
        if (!response.ok) {
            throw new Error(`El servidor respondió con el estado: ${response.status}`);
        }
        return response.text();
    }

    function parseHtml(htmlString) {
        const parser = new DOMParser();
        return parser.parseFromString(htmlString, 'text/html');
    }

    /**
     * Extrae todos los datos SEO relevantes del documento HTML, incluyendo H1, H2 y densidad de palabras.
     */
    function extraerDatosSEO(doc, baseUrl) {
        const getMetaContent = (selector) => doc.querySelector(selector)?.getAttribute('content') || 'No encontrado';
        const resolveUrl = (relativeUrl) => {
            if (!relativeUrl || relativeUrl.startsWith('http') || relativeUrl.startsWith('data:')) return relativeUrl;
            try { return new URL(relativeUrl, baseUrl).href; } catch (e) { return relativeUrl; }
        };

        // --- Datos existentes ---
        const title = doc.querySelector('title')?.innerText || 'No encontrado';
        const description = getMetaContent('meta[name="description"]');
        const keywords = getMetaContent('meta[name="keywords"]');
        const robots = getMetaContent('meta[name="robots"]');
        const ogTitle = getMetaContent('meta[property="og:title"]');
        const ogDescription = getMetaContent('meta[property="og:description"]');
        const ogImage = resolveUrl(getMetaContent('meta[property="og:image"]'));
        const ogUrl = getMetaContent('meta[property="og:url"]') || baseUrl; // NUEVO: Extraemos og:url
        
        const faviconUrl = doc.querySelector('link[rel="icon"], link[rel="shortcut icon"]')?.getAttribute('href');
        const favicon = resolveUrl(faviconUrl);
        const images = [...doc.querySelectorAll('img')]
            .filter(img => img.src && img.width > 50 && img.height > 50)
            .map(img => resolveUrl(img.getAttribute('src'), baseUrl));
            
        // --- Extracción de H1 y H2 ---
        const h1s = [...doc.querySelectorAll('h1')].map(h => h.innerText.trim()).filter(Boolean);
        const h2s = [...doc.querySelectorAll('h2')].map(h => h.innerText.trim()).filter(Boolean);

        // --- Lógica de densidad de palabras clave ---
        const bodyText = doc.body.innerText || '';
        const words = bodyText.toLowerCase().match(/[\wÀ-ú]+/g) || [];
        const totalWords = words.length;

        const stopWords = new Set(['de','la','que','el','en','y','a','los','del','se','un','por','con','no','una','su','para','es','al','lo','como','más','o','pero','sus','le','ha','me','si','sin','sobre','este','ya','entre','cuando','todo','esta','ser','son','dos','también','fue','era','muy','hasta','desde','nos','mi','qué','eso','tu','te','tus','les','ese']);

        const wordFrequencies = {};
        for (const word of words) {
            if (word.length > 2 && !stopWords.has(word) && !/^\d+$/.test(word)) {
                wordFrequencies[word] = (wordFrequencies[word] || 0) + 1;
            }
        }

        const sortedKeywords = Object.entries(wordFrequencies)
            .sort(([,a], [,b]) => b - a)
            .slice(0, 10);

        const keywordDensity = sortedKeywords.map(([word, count]) => ({
            word,
            count,
            density: totalWords > 0 ? ((count / totalWords) * 100).toFixed(2) : 0
        }));

        return { title, description, keywords, robots, ogTitle, ogDescription, ogImage, ogUrl, favicon, images, h1s, h2s, keywordDensity, totalWords };
    }

    /**
     * Renderiza los datos SEO en la interfaz de usuario, creando tarjetas para cada dato.
     */
    function mostrarResultados(data) {
        resultsContainer.innerHTML = '';
        
        // Función auxiliar mejorada para crear tarjetas con diferentes tipos de contenido
        const crearTarjeta = (title, content, type = 'text', options = {}) => {
            const card = document.createElement('div');
            card.className = 'result-card';
            if (options.fullWidth) {
                card.classList.add('full-width');
            }
            
            let contentHtml = '';
            // Si el contenido es nulo, vacío o "No encontrado" (y no es HTML pre-formateado)
            if (!content || content.length === 0 || (typeof content === 'string' && content === 'No encontrado' && type !== 'html')) {
                contentHtml = `<p class="not-found">${options.notFoundText || 'No encontrado'}</p>`;
            } else if (type === 'text') {
                contentHtml = `<p>${content}</p>`;
            } else if (type === 'html') { // NUEVO: Tipo para contenido HTML pre-formateado
                contentHtml = content;
            } else if (type === 'image') {
                contentHtml = `<img src="${content}" alt="${title}" loading="lazy">`;
            } else if (type === 'favicon') {
                 contentHtml = `<div><img src="${content}" alt="${title}" class="favicon-img"><span>${content}</span></div>`;
            } else if (type === 'list') {
                contentHtml = `<ul>${content.map(item => `<li>${item}</li>`).join('')}</ul>`;
            } else if (type === 'density') {
                const densityList = content.map(item => `<li><strong>${item.word}</strong>: ${item.count} usos (densidad: ${item.density}%)</li>`).join('');
                contentHtml = `
                    <p>Total de palabras en la página: ${data.totalWords || 0}</p>
                    <ul>${densityList}</ul>`;
            }

            card.innerHTML = `<h3>${title}</h3>${contentHtml}`;
            resultsContainer.appendChild(card);
        };
        
        const crearTarjetaMultiplesImagenes = (title, images) => {
             const card = document.createElement('div');
             card.className = 'result-card full-width'; // Aseguramos que sea full-width
             let imagesHtml = '';
             if (!images || images.length === 0) {
                 imagesHtml = `<p class="not-found">No se encontraron imágenes principales.</p>`;
             } else {
                 imagesHtml = images.map(src => `<img src="${src}" alt="Imagen del sitio" loading="lazy" style="max-width: 200px; margin: 5px; display: inline-block; vertical-align: middle;">`).join('');
             }
             card.innerHTML = `<h3>${title} (${images.length})</h3><div>${imagesHtml}</div>`;
             resultsContainer.appendChild(card);
        };
        
        // --- NUEVO: Tarjeta de Previsualización para Redes Sociales (Open Graph) ---
        // Usamos un placeholder si no hay imagen OG, y fallbacks para título/descripción
        const ogImageSrc = (data.ogImage && data.ogImage !== 'No encontrado') ? data.ogImage : 'https://via.placeholder.com/1200x630?text=Imagen+OG+no+encontrada'; 
        const ogTitleText = data.ogTitle || data.title || 'Título no disponible';
        const ogDescriptionText = data.ogDescription || data.description || 'Descripción no disponible';
        const ogUrlDisplay = (data.ogUrl && data.ogUrl !== 'No encontrado') ? new URL(data.ogUrl).hostname.replace('www.', '') : new URL(urlInput.value).hostname.replace('www.', ''); // Mostrar solo el dominio
        
        const socialPreviewContent = `
            <div class="og-preview">
                ${ogImageSrc !== 'https://via.placeholder.com/1200x630?text=Imagen+OG+no+encontrada' ? `<img src="${ogImageSrc}" class="og-image" alt="Previsualización Open Graph">` : `<div class="og-image" style="background-color: #e0e0e0; display: flex; align-items: center; justify-content: center; color: #666;">No hay imagen OG</div>`}
                <div class="og-content">
                    <div class="og-url">${ogUrlDisplay}</div>
                    <div class="og-title">${ogTitleText}</div>
                    <div class="og-description">${ogDescriptionText}</div>
                </div>
            </div>
        `;
        // Creamos la tarjeta usando el nuevo tipo 'html' para inyectar nuestro contenido pre-formateado
        crearTarjeta('Previsualización para Redes Sociales', socialPreviewContent, 'html', { fullWidth: true });
        
        // Renderizar el resto de las tarjetas
        crearTarjeta('Título de la Página', data.title);
        crearTarjeta('Meta Descripción', data.description);
        crearTarjeta('Encabezados H1', data.h1s, 'list', { notFoundText: 'No se encontraron etiquetas H1.' });
        crearTarjeta('Encabezados H2', data.h2s, 'list', { notFoundText: 'No se encontraron etiquetas H2.' });
        crearTarjeta('Palabras Clave (Top 10)', data.keywordDensity, 'density', { fullWidth: true, notFoundText: 'No hay suficientes palabras para calcular la densidad.' });
        crearTarjeta('Meta Keywords', data.keywords);
        crearTarjeta('Meta Robots', data.robots);
        crearTarjeta('Favicon', data.favicon, 'favicon');
        crearTarjetaMultiplesImagenes('Imágenes Principales', data.images);
    }

    function mostrarError(message) {
        errorMessage.textContent = message;
        errorMessage.style.display = 'block';
    }

    </script>

</body>
</html>
